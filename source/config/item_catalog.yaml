schema_version: 1

# All competition boxes have the same measured outer size. Labels are mounted
# on the rear vertical wall. Box order changes between runs, so these six slots
# are calibrated left-to-right as seen from the active right-side
# placement_observe_pose; vision maps
# each detected label to one slot dynamically.
box:
  outer_size_m: [0.180, 0.132, 0.087]
  wall_clearance_m: 0.012
  label_surface: rear_vertical_wall
  label_match_threshold: 0.42
  label_search_roi_norm: [0.0, 0.0, 1.0, 1.0]
  slot_centers_mm:
    - []
    - []
    - []
    - []
    - []
    - []
  # Optional static fallback for six tightly packed boxes. Both points are box
  # centers for the first/last slot as seen left-to-right in the fixed placement
  # observation image. Intermediate slots are linearly interpolated.
  row_first_slot_center_mm: []
  row_last_slot_center_mm: []
  row_slot_pitch_mm: 180.0
  row_slot_pitch_tolerance_mm: 20.0

items:
  yellow_block:
    display_name: 黄色物块
    aliases: [yellow block, 黄色物块, 黄块]
    grasp_prompt: yellow block
    kind: block
    reference_image: ../assets/item_references/yellow_block.jpeg
    object_size_m: [0.060, 0.060, 0.060]
    placement:
      enabled: false
      # Base alignment puts every target box in the same arm-relative pose.
      # Active path is the right-side mirror of the 2026-07-31 left-side
      # calibration. Piper's calibrated Cartesian convention mirrors Y and
      # yaw; roll is retained (matching the verified observation profiles).
      base_aligned_enabled: true
      # Keep the forward extension above the box rim; descend only after alignment.
      base_aligned_approach_pose_mm_deg: [-22.262, -283.822, 491.100, 85.074, 87.787, -179.697]
      base_aligned_release_pose_mm_deg: [-22.262, -283.822, 307.657, 85.074, 87.787, -179.697]
      base_aligned_retreat_pose_mm_deg: [-22.262, -283.822, 491.100, 85.074, 87.787, -179.697]
      release_offset_mm: [0.0, 0.0, 0.0]
      release_rpy_deg: []
      approach_height_mm: 120.0
      retreat_height_mm: 140.0

  red_block:
