robot_executor:
  ros__parameters:
    robot_backend: "fake"
    auto_enable: true
    disconnect_after_run: false
    poll_interval_s: 0.05
    default_speed_percent: 25.0
    default_gripper_open_mm: 70.0
    # Increased from 0.6 after objects could slip during transit. Keep this
    # below the gripper's high-force limit while retaining a firm grasp.
    default_gripper_close_effort_nm: 0.8
    enable_pregrasp: false
    execution_strategy: "center_horizontal"
    pose_execution_mode: "direct"
    moveit_ik_timeout_s: 1.5
    pose_goal_hold_s: 0.0
    # Keep Piper ARRIVED as the normal completion signal.  Some firmware runs
    # leave it at NOT_ARRIVED after the endpoint has already settled; accept
    # that case only after a healthy controller remains within a strict pose
    # window continuously.  This prevents intermittent final-descent timeouts
    # without weakening the normal 20 mm waypoint guard.
    motion_arrived_pose_fallback_enabled: true
    motion_arrived_pose_fallback_pos_tolerance_mm: 2.0
    motion_arrived_pose_fallback_rot_tolerance_deg: 2.0
    motion_arrived_pose_fallback_hold_s: 0.6
    named_pose_timeout_s: 30.0
    plan_pose_timeout_s: 45.0
    # Treat the values above as no-progress watchdogs, not absolute motion
    # deadlines. A healthy arm that is still converging may keep moving for as
    # long as necessary; a stuck/disabled/disconnected arm still fails safely.
    motion_progress_extends_timeout: true
    motion_progress_position_epsilon_mm: 0.5
    motion_progress_rotation_epsilon_deg: 0.25
    move_pos_tolerance_mm: 20.0
    move_rot_tolerance_deg: 10.0
    reject_degenerate_grasp_waypoints: true
    min_grasp_approach_offset_m: 0.005
    min_retreat_lift_m: 0.03
    # Active work table is on the arm's right side. Keep the wrist heading on
    # the verified right-side branch; the left-side profile remains preserved
    # under config/calibration/observation_poses/left_side.yaml.
    top_down_rpy_deg: [180.0, 85.0, 90.0]
    top_down_rpy_variants_deg: [180.0, 85.0, 90.0]
    # Keep the wrist aligned with the arm-to-target radial direction. At the
    # verified straight-right work-area center (azimuth -90 deg), yaw remains
    # -90 deg; offset targets rotate base and tool yaw together.
    center_horizontal_follow_target_azimuth: true
    center_horizontal_reference_azimuth_deg: -90.0
    center_horizontal_max_yaw_adjust_deg: 45.0
    # For cube top-down grasps, align yaw with the base-to-target radial
    # direction once at safe height so the wrist does not repeatedly correct
    # above an offset object.
    safe_top_down_follow_target_azimuth: true
    safe_top_down_reference_azimuth_deg: -90.0
    safe_top_down_max_yaw_adjust_deg: 45.0
    top_down_min_safe_z_mm: 350.0
    top_down_min_target_z_mm: 200.0
    top_down_approach_height_mm: 110.0
    top_down_lift_height_mm: 80.0
    top_down_lift_to_safe_z: false
    top_down_lateral_step_mm: 1000.0
    # Keep the vertical path constrained, but avoid repeatedly stopping and
    # resolving IK near the bottle.  A typical ~235 mm descent is now 3 steps
    # instead of about 10, while the final contact pose is unchanged.
    top_down_vertical_step_mm: 80.0
    # Keep cube descent close to a vertical Cartesian path. Larger values caused
    # unsafe joint-space arcs during real hardware testing.
    safe_top_down_vertical_step_mm: 80.0
    # Slow only the final cube contact segment to reduce collision force.
    safe_top_down_final_speed_percent: 2.0
    # The dashboard speed is the real Piper MotionCtrl_2 percentage.  Keep the
    # configurable guard, but do not silently clamp every request to 5%.
    top_down_max_speed_percent: 100.0
    placement_box_outer_size_m: [0.180, 0.132, 0.087]
    placement_slot_count: 6
    placement_box_size_tolerance_m: 0.005
    placement_min_label_confidence: 0.42
    placement_min_vertical_clearance_mm: 50.0
    placement_final_speed_percent: 2.0
    use_handoff_pose: true
    handoff_pose: [200.0, 20.0, 300.0, 10.0, 120.0, 0.0]
    home_pose: [57.0, 0.0, 215.0, 0.0, 85.0, 0.0]
    # Elevated holding pose after a successful grasp. Keep the Home heading,
    # extend about 200 mm along base +X, and keep the gripper closed. Before
    # moving laterally, lift vertically to the safe clearance height below.
    move_to_post_grasp_pose: true
    post_grasp_safe_lift_z_mm: 350.0
    post_grasp_pose: [256.885, 0.0, 400.0, 0.0, 84.939, 0.0]
