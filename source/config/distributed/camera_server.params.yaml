camera_server:
  ros__parameters:
    # Empty values resolve to the environment-selected worker Python and the
    # worker script shipped in this package.
    worker_python_executable: ""
    worker_script: ""
    worker_timeout_s: 60.0
    worker_mode: "daemon"
    camera_width: 640
    camera_height: 480
    camera_fps: 30
    clip_max_m: 3.0
    camera_frame: "camera_color_optical_frame"
    bilateral_diameter: 5
    bilateral_sigma_color: 0.02
    bilateral_sigma_space: 5.0
    median_kernel_size: 5
