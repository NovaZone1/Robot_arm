# This config file is used by ros2_control
controller_manager:
  ros__parameters:
    update_rate: 500  # Hz

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
      joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6

arm_controller:
  ros__parameters:
    joints:
      - joint1
      - joint2
      - joint3
      - joint4
      - joint5
      - joint6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      joint1: {p: 8000.0, i: 0.0, d: 200.0, i_clamp: 0.0, ff_velocity: 0.0}
      joint2: {p: 4000.0, i: 0.0, d: 100.0, i_clamp: 0.0, ff_velocity: 0.0}
      joint3: {p: 2000.0, i: 0.0, d: 50.0,  i_clamp: 0.0, ff_velocity: 0.0}
      joint4: {p: 800.0,  i: 0.0, d: 20.0,  i_clamp: 0.0, ff_velocity: 0.0}
      joint5: {p: 400.0,  i: 0.0, d: 10.0,  i_clamp: 0.0, ff_velocity: 0.0}
      joint6: {p: 200.0,  i: 0.0, d: 5.0,   i_clamp: 0.0, ff_velocity: 0.0}
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0

gripper_controller:
  ros__parameters:
    joints:
      - joint7
      - joint8
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    gains:
      joint7: {p: 50000.0, i: 0.0, d: 50.0, i_clamp: 0.0, ff_velocity: 0.0}
      joint8: {p: 50000.0, i: 0.0, d: 50.0, i_clamp: 0.0, ff_velocity: 0.0}
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    constraints:
      stopped_velocity_tolerance: 0.01
      goal_time: 0.0
